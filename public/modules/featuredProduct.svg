<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-featuredProduct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-featuredProduct)"/>

  <!-- Grid pattern -->
  <pattern id="grid-featuredProduct" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-featuredProduct)"/>

  <!-- Product content (left) -->
  <rect x="60" y="60" width="80" height="24" rx="4" fill="#f59e0b" fill-opacity="0.3"/>
  <rect x="60" y="100" width="240" height="32" rx="4" fill="#a5b4fc" fill-opacity="0.4"/>
  <rect x="60" y="145" width="200" height="14" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
  <rect x="60" y="165" width="180" height="14" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>

  <!-- Price -->
  <rect x="60" y="200" width="80" height="28" rx="4" fill="#6366f1"/>
  <rect x="150" y="205" width="50" height="18" rx="2" fill="#a5b4fc" fill-opacity="0.2"/>

  <!-- Features -->
  <g>
    <circle cx="75" cy="250" r="8" fill="#22c55e" fill-opacity="0.3"/>
    <rect x="92" y="245" width="120" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.2"/>
  </g>
  <g>
    <circle cx="75" cy="275" r="8" fill="#22c55e" fill-opacity="0.3"/>
    <rect x="92" y="270" width="140" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.2"/>
  </g>
  <g>
    <circle cx="75" cy="300" r="8" fill="#22c55e" fill-opacity="0.3"/>
    <rect x="92" y="295" width="100" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.2"/>
  </g>

  <!-- CTA button -->
  <rect x="60" y="325" width="150" height="40" rx="8" fill="#6366f1"/>

  <!-- Product image (right) -->
  <rect x="360" y="50" width="240" height="260" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
  <rect x="380" y="70" width="200" height="220" rx="8" fill="#6366f1" fill-opacity="0.2"/>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Featured Product</text>
</svg>
