  <g>
    <rect x="185" y="225" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="195" y="235" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="195" y="305" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="195" y="320" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <g>
    <rect x="330" y="225" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="340" y="235" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="340" y="305" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="340" y="320" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <g>
    <rect x="475" y="225" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="485" y="235" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="485" y="305" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="485" y="320" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="350" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Product Grid</text>
</svg>
