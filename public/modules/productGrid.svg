<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-productGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-productGrid)"/>

  <!-- Grid pattern -->
  <pattern id="grid-productGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-productGrid)"/>

  <!-- Header -->
  <rect x="200" y="30" width="240" height="24" rx="4" fill="#a5b4fc" fill-opacity="0.3"/>
  <rect x="240" y="60" width="160" height="14" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>

  <!-- Product cards - Row 1 -->
  <g>
    <rect x="40" y="100" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="50" y="110" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="50" y="180" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="50" y="195" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <g>
    <rect x="185" y="100" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="195" y="110" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="195" y="180" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="195" y="195" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <g>
    <rect x="330" y="100" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="340" y="110" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="340" y="180" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="340" y="195" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <g>
    <rect x="475" y="100" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="485" y="110" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="485" y="180" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="485" y="195" width="50" height="10" rx="2" fill="#6366f1"/>
  </g>

  <!-- Product cards - Row 2 -->
  <g>
    <rect x="40" y="225" width="130" height="110" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="50" y="235" width="110" height="60" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="50" y="305" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="50" y="320" width="50" height="10" rx="2" fill="#6366f1"/>
