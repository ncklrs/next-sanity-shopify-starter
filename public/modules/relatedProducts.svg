<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-relatedProducts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-relatedProducts)"/>

  <!-- Grid pattern -->
  <pattern id="grid-relatedProducts" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-relatedProducts)"/>

  <!-- Header -->
  <rect x="40" y="40" width="200" height="24" rx="4" fill="#a5b4fc" fill-opacity="0.3"/>

  <!-- Navigation arrows -->
  <circle cx="560" cy="52" r="16" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="600" cy="52" r="16" fill="#6366f1" fill-opacity="0.3"/>

  <!-- Product cards -->
  <g>
    <rect x="40" y="90" width="140" height="200" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="50" y="100" width="120" height="110" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="50" y="220" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="50" y="240" width="60" height="14" rx="2" fill="#6366f1"/>
    <rect x="50" y="265" width="120" height="14" rx="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="195" y="90" width="140" height="200" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="205" y="100" width="120" height="110" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="205" y="220" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="205" y="240" width="60" height="14" rx="2" fill="#6366f1"/>
    <rect x="205" y="265" width="120" height="14" rx="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="350" y="90" width="140" height="200" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="360" y="100" width="120" height="110" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="360" y="220" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="360" y="240" width="60" height="14" rx="2" fill="#6366f1"/>
    <rect x="360" y="265" width="120" height="14" rx="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="505" y="90" width="140" height="200" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.15"/>
    <rect x="515" y="100" width="120" height="110" rx="4" fill="#6366f1" fill-opacity="0.1"/>
    <rect x="515" y="220" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
    <rect x="515" y="240" width="60" height="14" rx="2" fill="#6366f1" fill-opacity="0.3"/>
  </g>

  <!-- Dots indicator -->
  <circle cx="290" cy="310" r="4" fill="#6366f1"/>
  <circle cx="310" cy="310" r="4" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="330" cy="310" r="4" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="350" cy="310" r="4" fill="#6366f1" fill-opacity="0.3"/>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Related Products</text>
</svg>
