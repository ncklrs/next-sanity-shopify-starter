<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-trustBadges" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-trustBadges)"/>

  <!-- Grid pattern -->
  <pattern id="grid-trustBadges" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-trustBadges)"/>

  <!-- Trust badge cards - horizontal layout -->
  <g>
    <rect x="40" y="120" width="130" height="120" rx="12" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.2"/>
    <circle cx="105" cy="160" r="24" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-opacity="0.4"/>
    <path d="M95 160 L102 167 L115 154" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="195" width="90" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="55" y="215" width="100" height="8" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
  </g>

  <g>
    <rect x="185" y="120" width="130" height="120" rx="12" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.2"/>
    <circle cx="250" cy="160" r="24" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4"/>
    <rect x="238" y="150" width="24" height="20" rx="2" fill="none" stroke="#6366f1" stroke-width="2"/>
    <rect x="243" y="155" width="14" height="10" rx="1" fill="#6366f1" fill-opacity="0.5"/>
    <rect x="205" y="195" width="90" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="200" y="215" width="100" height="8" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
  </g>

  <g>
    <rect x="330" y="120" width="130" height="120" rx="12" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.2"/>
    <circle cx="395" cy="160" r="24" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.4"/>
    <path d="M395 145 L400 155 L411 157 L403 165 L405 176 L395 171 L385 176 L387 165 L379 157 L390 155 Z" fill="#f59e0b" fill-opacity="0.6"/>
    <rect x="350" y="195" width="90" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="345" y="215" width="100" height="8" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
  </g>

  <g>
    <rect x="475" y="120" width="130" height="120" rx="12" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.2"/>
    <circle cx="540" cy="160" r="24" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.4"/>
    <path d="M530 155 L540 165 L550 155 M540 165 L540 150" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="495" y="195" width="90" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="490" y="215" width="100" height="8" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
