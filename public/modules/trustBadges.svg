  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Trust Badges</text>
