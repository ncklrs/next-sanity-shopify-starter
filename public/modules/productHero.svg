<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-productHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-productHero)"/>

  <!-- Grid pattern -->
  <pattern id="grid-productHero" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-productHero)"/>

  <!-- Product Image placeholder -->
  <rect x="40" y="60" width="260" height="240" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
  <rect x="60" y="80" width="220" height="200" rx="8" fill="#6366f1" fill-opacity="0.2"/>

  <!-- Thumbnail row -->
  <rect x="40" y="310" width="56" height="40" rx="4" fill="#6366f1" fill-opacity="0.3"/>
  <rect x="104" y="310" width="56" height="40" rx="4" fill="#6366f1" fill-opacity="0.15"/>
  <rect x="168" y="310" width="56" height="40" rx="4" fill="#6366f1" fill-opacity="0.15"/>

  <!-- Product info -->
  <rect x="340" y="60" width="80" height="24" rx="4" fill="#22c55e" fill-opacity="0.3"/>
  <rect x="340" y="96" width="220" height="28" rx="4" fill="#a5b4fc" fill-opacity="0.4"/>
  <rect x="340" y="136" width="100" height="24" rx="4" fill="#6366f1"/>
  <rect x="450" y="136" width="60" height="24" rx="4" fill="#a5b4fc" fill-opacity="0.2"/>

  <!-- Description lines -->
  <rect x="340" y="180" width="240" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
  <rect x="340" y="200" width="200" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>

  <!-- Variant selector -->
  <rect x="340" y="232" width="60" height="32" rx="4" fill="#6366f1" fill-opacity="0.3"/>
  <rect x="408" y="232" width="60" height="32" rx="4" fill="#a5b4fc" fill-opacity="0.15"/>
  <rect x="476" y="232" width="60" height="32" rx="4" fill="#a5b4fc" fill-opacity="0.15"/>

  <!-- Add to cart button -->
  <rect x="340" y="284" width="200" height="44" rx="8" fill="#6366f1"/>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Product Hero</text>
</svg>
