<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-productCarousel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-productCarousel)"/>

  <!-- Grid pattern -->
  <pattern id="grid-productCarousel" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-productCarousel)"/>

  <!-- Header -->
  <rect x="200" y="40" width="240" height="24" rx="4" fill="#a5b4fc" fill-opacity="0.3"/>
  <rect x="240" y="70" width="160" height="14" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>

  <!-- Navigation arrows -->
  <circle cx="30" cy="180" r="20" fill="#6366f1" fill-opacity="0.3"/>
  <path d="M35 180 L25 175 L25 185 Z" fill="#a5b4fc" transform="rotate(180 30 180)"/>

  <circle cx="610" cy="180" r="20" fill="#6366f1" fill-opacity="0.3"/>
  <path d="M615 180 L605 175 L605 185 Z" fill="#a5b4fc"/>

  <!-- Product cards -->
  <g>
    <rect x="70" y="110" width="140" height="180" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="80" y="120" width="120" height="100" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="80" y="230" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="80" y="250" width="60" height="12" rx="2" fill="#6366f1"/>
    <rect x="80" y="270" width="120" height="12" rx="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="225" y="110" width="140" height="180" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="235" y="120" width="120" height="100" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="235" y="230" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="235" y="250" width="60" height="12" rx="2" fill="#6366f1"/>
    <rect x="235" y="270" width="120" height="12" rx="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="380" y="110" width="140" height="180" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="390" y="120" width="120" height="100" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="390" y="230" width="100" height="12" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="390" y="250" width="60" height="12" rx="2" fill="#6366f1"/>
    <rect x="390" y="270" width="120" height="12" rx="4" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <!-- Partial card (edge) -->
  <rect x="535" y="110" width="140" height="180" rx="8" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.15"/>

  <!-- Dots indicator -->
  <circle cx="290" cy="310" r="4" fill="#6366f1"/>
  <circle cx="310" cy="310" r="4" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="330" cy="310" r="4" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="350" cy="310" r="4" fill="#6366f1" fill-opacity="0.3"/>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Product Carousel</text>
</svg>
