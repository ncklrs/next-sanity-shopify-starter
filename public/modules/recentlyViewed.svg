<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-recentlyViewed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-recentlyViewed)"/>

  <!-- Grid pattern -->
  <pattern id="grid-recentlyViewed" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-recentlyViewed)"/>

  <!-- Header with clock icon -->
  <circle cx="55" cy="52" r="12" fill="#6366f1" fill-opacity="0.3" stroke="#a5b4fc" stroke-opacity="0.3"/>
  <path d="M55 45 L55 52 L60 55" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <rect x="80" y="40" width="180" height="24" rx="4" fill="#a5b4fc" fill-opacity="0.3"/>

  <!-- Navigation arrows -->
  <circle cx="560" cy="52" r="16" fill="#6366f1" fill-opacity="0.3"/>
  <circle cx="600" cy="52" r="16" fill="#6366f1" fill-opacity="0.3"/>

  <!-- Product cards - smaller, more compact -->
  <g>
    <rect x="40" y="90" width="110" height="150" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="48" y="98" width="94" height="80" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="48" y="186" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="48" y="202" width="50" height="12" rx="2" fill="#6366f1"/>
    <rect x="48" y="222" width="94" height="10" rx="3" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="160" y="90" width="110" height="150" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="168" y="98" width="94" height="80" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="168" y="186" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="168" y="202" width="50" height="12" rx="2" fill="#6366f1"/>
    <rect x="168" y="222" width="94" height="10" rx="3" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="280" y="90" width="110" height="150" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="288" y="98" width="94" height="80" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="288" y="186" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="288" y="202" width="50" height="12" rx="2" fill="#6366f1"/>
    <rect x="288" y="222" width="94" height="10" rx="3" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="400" y="90" width="110" height="150" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="408" y="98" width="94" height="80" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="408" y="186" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.3"/>
    <rect x="408" y="202" width="50" height="12" rx="2" fill="#6366f1"/>
    <rect x="408" y="222" width="94" height="10" rx="3" fill="#6366f1" fill-opacity="0.4"/>
  </g>

  <g>
    <rect x="520" y="90" width="110" height="150" rx="6" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.15"/>
    <rect x="528" y="98" width="94" height="80" rx="4" fill="#6366f1" fill-opacity="0.1"/>
    <rect x="528" y="186" width="80" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
  </g>

  <!-- History indicator -->
  <rect x="40" y="260" width="560" height="4" rx="2" fill="#6366f1" fill-opacity="0.1"/>
  <rect x="40" y="260" width="350" height="4" rx="2" fill="#6366f1" fill-opacity="0.3"/>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="300" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Recently Viewed</text>
</svg>
