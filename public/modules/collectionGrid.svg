<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-collectionGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232337;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#grad-collectionGrid)"/>

  <!-- Grid pattern -->
  <pattern id="grid-collectionGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <rect width="640" height="360" fill="url(#grid-collectionGrid)"/>

  <!-- Header -->
  <rect x="200" y="30" width="240" height="24" rx="4" fill="#a5b4fc" fill-opacity="0.3"/>
  <rect x="220" y="60" width="200" height="14" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>

  <!-- Collection cards -->
  <g>
    <rect x="40" y="95" width="180" height="220" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="50" y="105" width="160" height="130" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="50" y="245" width="120" height="16" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="50" y="270" width="140" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
    <rect x="50" y="290" width="70" height="14" rx="2" fill="#6366f1" fill-opacity="0.5"/>
  </g>

  <g>
    <rect x="230" y="95" width="180" height="220" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="240" y="105" width="160" height="130" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="240" y="245" width="120" height="16" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="240" y="270" width="140" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
    <rect x="240" y="290" width="70" height="14" rx="2" fill="#6366f1" fill-opacity="0.5"/>
  </g>

  <g>
    <rect x="420" y="95" width="180" height="220" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3"/>
    <rect x="430" y="105" width="160" height="130" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <rect x="430" y="245" width="120" height="16" rx="2" fill="#a5b4fc" fill-opacity="0.4"/>
    <rect x="430" y="270" width="140" height="10" rx="2" fill="#a5b4fc" fill-opacity="0.15"/>
    <rect x="430" y="290" width="70" height="14" rx="2" fill="#6366f1" fill-opacity="0.5"/>
  </g>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="28" rx="4" fill="#6366f1" fill-opacity="0.2"/>
  <text x="32" y="39" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">E-commerce</text>

  <!-- Module title -->
  <text x="320" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b4fc" text-anchor="middle" fill-opacity="0.7">Collection Grid</text>
</svg>
